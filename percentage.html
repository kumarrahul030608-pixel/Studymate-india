<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Percentage Calculator | StudyMate</title><style>body{font-family:system-ui;background:#f6f7fb;margin:0;color:#172033}.wrap{max-width:700px;margin:auto;padding:35px 20px}header{background:#111827;color:white}.box{background:white;padding:25px;border-radius:18px;box-shadow:0 12px 35px #0001}input{width:100%;padding:12px;margin:7px 0 15px;border:1px solid #ddd;border-radius:9px;box-sizing:border-box}button{background:#4f46e5;color:white;border:0;padding:12px 18px;border-radius:9px;font-weight:700}.result{margin-top:18px;padding:18px;background:#eef2ff;border-radius:12px;font-weight:800}a{color:#4f46e5}</style></head><body><header><div class="wrap"><b>StudyMate India</b></div></header><main class="wrap"><a href="index.html">← Home</a><div class="box"><h1>％ Percentage Calculator</h1><label>Obtained value</label><input id="a" type="number"><label>Total value</label><input id="b" type="number"><button onclick="calc()">Calculate</button><div class="result" id="r">Result will appear here.</div></div></main><script>function calc(){let x=+a.value,y=+b.value;r.textContent=y>0?`Percentage = ${(x/y*100).toFixed(2)}%`:'Enter a valid total.'}</script></body></html>
