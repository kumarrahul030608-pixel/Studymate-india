<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attendance Calculator | StudyMate</title><style>body{font-family:system-ui;background:#f6f7fb;margin:0;color:#172033}.wrap{max-width:700px;margin:auto;padding:35px 20px}header{background:#111827;color:white}.box{background:white;padding:25px;border-radius:18px;box-shadow:0 12px 35px #0001}input{width:100%;padding:12px;margin:7px 0 15px;border:1px solid #ddd;border-radius:9px;box-sizing:border-box}button{background:#4f46e5;color:white;border:0;padding:12px 18px;border-radius:9px;font-weight:700}.result{margin-top:18px;padding:18px;background:#eef2ff;border-radius:12px;font-weight:800}a{color:#4f46e5}</style></head><body><header><div class="wrap"><b>StudyMate India</b></div></header><main class="wrap"><a href="index.html">← Home</a><div class="box"><h1>✅ Attendance Calculator</h1><p>Check your attendance percentage and plan classes.</p><label>Classes attended</label><input id="a" type="number" min="0"><label>Total classes</label><input id="t" type="number" min="1"><label>Required attendance %</label><input id="req" type="number" value="75" min="1" max="100"><button onclick="calc()">Calculate</button><div class="result" id="r">Enter your details.</div></div></main><script>function calc(){let A=+a.value,T=+t.value,R=+req.value;if(!T||A<0||A>T)return r.textContent='Enter valid values.';let p=A/T*100;let miss=Math.floor(A/(R/100)-T);let need=Math.max(0,Math.ceil((R*T-A)/(1-R/100)));r.innerHTML=`Current attendance: ${p.toFixed(2)}%<br>${p>=R?'You are above the required percentage.':'You need to attend '+need+' more class(es) without missing to reach '+R+'%.'}`}</script></body></html>
