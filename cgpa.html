<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CGPA Calculator | StudyMate India</title><style>body{font-family:system-ui;background:#f6f7fb;margin:0;color:#172033}.wrap{max-width:700px;margin:auto;padding:35px 20px}header{background:#111827;color:white;padding:20px}.box{background:white;padding:25px;border-radius:18px;box-shadow:0 12px 35px #0001}input{width:100%;padding:12px;margin:7px 0 15px;border:1px solid #ddd;border-radius:9px;box-sizing:border-box}button{background:#4f46e5;color:white;border:0;padding:12px 18px;border-radius:9px;font-weight:700;cursor:pointer}.result{margin-top:18px;padding:18px;background:#eef2ff;border-radius:12px;font-size:20px;font-weight:800}a{color:#4f46e5}</style></head><body><header><div class="wrap"><b>StudyMate India</b></div></header><main class="wrap"><a href="index.html">← Home</a><div class="box"><h1>🎓 CGPA Calculator</h1><p>Calculate average CGPA for up to 6 semesters.</p><div id="fields"></div><button onclick="calc()">Calculate CGPA</button><div class="result" id="r">Your result will appear here.</div></div></main><script>for(let i=1;i<=6;i++)fields.innerHTML+=`<label>Semester ${i} CGPA (optional)</label><input class="x" type="number" min="0" max="10" step=".01" placeholder="e.g. 8.25">`;function calc(){let a=[...document.querySelectorAll('.x')].map(x=>+x.value).filter(x=>x>0&&x<=10);r.textContent=a.length?'CGPA = '+(a.reduce((s,x)=>s+x,0)/a.length).toFixed(2):'Please enter at least one valid CGPA.'}</script></body></html>
