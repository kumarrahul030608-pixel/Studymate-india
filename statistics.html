<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Statistics Calculator | StudyMate</title><style>body{font-family:system-ui;background:#f6f7fb;margin:0;color:#172033}.wrap{max-width:700px;margin:auto;padding:35px 20px}header{background:#111827;color:white}.box{background:white;padding:25px;border-radius:18px;box-shadow:0 12px 35px #0001}textarea{width:100%;height:130px;padding:12px;border:1px solid #ddd;border-radius:9px;box-sizing:border-box}button{background:#4f46e5;color:white;border:0;padding:12px 18px;border-radius:9px;font-weight:700;margin-top:12px}.result{margin-top:18px;padding:18px;background:#eef2ff;border-radius:12px;font-weight:800}a{color:#4f46e5}</style></head><body><header><div class="wrap"><b>StudyMate India</b></div></header><main class="wrap"><a href="index.html">← Home</a><div class="box"><h1>📊 Statistics Calculator</h1><p>Enter numbers separated by commas.</p><textarea id="d" placeholder="10, 12, 15, 18, 20"></textarea><button onclick="calc()">Calculate</button><div class="result" id="r">Mean, median, mode and standard deviation will appear here.</div></div></main><script>function calc(){let a=d.value.split(',').map(Number).filter(Number.isFinite).sort((x,y)=>x-y);if(!a.length)return r.textContent='Enter valid numbers.';let mean=a.reduce((s,x)=>s+x,0)/a.length,med=a.length%2?a[(a.length-1)/2]:(a[a.length/2-1]+a[a.length/2])/2,sd=Math.sqrt(a.reduce((s,x)=>s+(x-mean)**2,0)/a.length);let f={};a.forEach(x=>f[x]=(f[x]||0)+1);let mx=Math.max(...Object.values(f)),modes=Object.keys(f).filter(x=>f[x]===mx);r.innerHTML=`Mean: ${mean.toFixed(2)}<br>Median: ${med.toFixed(2)}<br>Mode: ${mx>1?modes.join(', '):'No mode'}<br>Standard Deviation: ${sd.toFixed(2)}`}</script></body></html>
